[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaea-speed-tool"
dynamic = ["version"]
description = "Speed-change tool for Arcaea songs (charts, audio, songlist)"
authors = [{ name = "him lijnn" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = [
    "arcfutil",
    "tomli>=1.0.0; python_version < '3.11'",
]

[project.scripts]
arcaea-speed-tool = "src.main:main"

[project.urls]
Homepage = "https://github.com/himlijnn/arcaea_speed_tool"
Repository = "https://github.com/himlijnn/arcaea_speed_tool"
Issues = "https://github.com/himlijnn/arcaea_speed_tool/issues"

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
include = ["src*"]
