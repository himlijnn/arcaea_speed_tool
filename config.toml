[paths]

# Input directory (songs folder path)
input_dir = "./songs"

# Output directory (all processed files will be written here)
output_dir = "./songs_output"

[global]

# Speed multiplier
speed = 1.25

# Audio offset scale. (0 = auto: 1 / speed)
offset = 0

# Processing mode: "all" / "chart" / "audio" / "songlist"
mode = "all"

# Copy unprocessed files (images etc.) to output directory.
copy = true

# Force LF line endings on output files
force_lf = true

[aff]

# Enable the BPM exclusion list below
enable_exclusion = true

# BPM values excluded from scaling (per-chart compatibility fixes)
excluded_bpm = [
    -23400000.0, # aegleseeker/2.aff
    -1793400.0,  # kokoro/2.aff
    -17800000.0, # testify/3.aff
    -40000000.0, # theultimacy/2.aff
    -16000000.0, # tsukinimurakumo/2.aff
    -20720.0,    # worldender/2.aff & 3.aff
]

[audio]

# Force non-WAV audio to OGG Vorbis output.
# true  = accept all audio formats, convert non-WAV to .ogg
# false = accept all audio formats, keep original encoding
force_vorbis = true

# Number of parallel worker threads
workers = 8

# Keep metadata tags
keep_metadata = false

# Pitch (true = shift pitch with speed, false = keep original pitch)
pitch = true

# Output channel count
channels = 2

# Volume multiplier (1 = unchanged)
volume = 1

# Audio bitrate (e.g. "188k"). Leave empty to use no bitrate constraint.
bitrate = "188k"

# Output sample rate (0 = keep original sample rate)
samplerate = 44100
